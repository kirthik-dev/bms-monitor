name: BMS Monitor

on:
  schedule:
    - cron: '* * * * *'  # Every 1 minute
  workflow_dispatch:  # Manual trigger option

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python monitor.py --region hyderabad --event-code ET00504055 --date-code 20260724 --test-telegram